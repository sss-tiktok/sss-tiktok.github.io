<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𝐓𝐢𝐤𝐓𝐨𝐤 𝐕𝐢𝐝𝐞𝐨 𝐃𝐨𝐰𝐧𝐥𝐨𝐚𝐝𝐞𝐫 - Pro Ultimate</title>
  
  <!-- Google Fonts (Poppins) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      transition: background 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                  color 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                  border-color 0.3s ease, 
                  box-shadow 0.3s ease;
    }

    body {
      background-color: #0b0d14;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Glowing Neon Blobs */
    .background-blob-1 {
      position: absolute;
      width: 350px;
      height: 350px;
      background: linear-gradient(135deg, #ff0050, #ff007f);
      border-radius: 50%;
      filter: blur(130px);
      top: 5%;
      left: 10%;
      z-index: 0;
      opacity: 0.45;
      animation: floatBlob 8s infinite alternate ease-in-out;
    }

    .background-blob-2 {
      position: absolute;
      width: 380px;
      height: 380px;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      border-radius: 50%;
      filter: blur(140px);
      bottom: 5%;
      right: 10%;
      z-index: 0;
      opacity: 0.4;
      animation: floatBlob 10s infinite alternate-reverse ease-in-out;
    }

    @keyframes floatBlob {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -30px) scale(1.1); }
    }

    /* Toast Notification Container (Compact & Optimized) */
    #toast-container {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    .toast {
      background: rgba(18, 22, 33, 0.9);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateY(-15px) scale(0.95);
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .toast.success { border-color: #00f2fe; color: #00f2fe; }
    .toast.error { border-color: #ff0050; color: #ff0050; }
    .toast.welcome { border-color: #7928ca; color: #ff0080; background: rgba(25, 18, 35, 0.95); }

    /* Header Top Section */
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
    }

    .dev-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      color: #00f2fe;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      letter-spacing: 0.5px;
    }

    .theme-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      outline: none;
    }

    .theme-btn:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.15);
    }

    .theme-btn:active {
      transform: scale(0.95);
    }

    /* Main Container */
    .container {
      position: relative;
      z-index: 1;
      background: rgba(18, 22, 33, 0.65);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 35px 25px;
      border-radius: 28px;
      box-shadow: 
        20px 20px 50px rgba(4, 5, 8, 0.8),
        -10px -10px 40px rgba(30, 36, 54, 0.3),
        inset 0 1px 1px rgba(255, 255, 255, 0.15);
      text-align: center;
      width: 100%;
      max-width: 450px;
    }

    h2 {
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(135deg, #00f2fe, #ff0050);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 22px;
      letter-spacing: 0.5px;
    }

    /* Input Wrapper & Micro-Interactions */
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(11, 13, 20, 0.8);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 
        inset 4px 4px 10px rgba(0, 0, 0, 0.8),
        inset -3px -3px 8px rgba(255, 255, 255, 0.03);
      padding: 6px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .input-wrapper:focus-within {
      border-color: #00f2fe;
      box-shadow: 
        inset 4px 4px 10px rgba(0, 0, 0, 0.8),
        0 0 15px rgba(0, 242, 254, 0.3);
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: none;
      outline: none;
      background: transparent;
      color: #fff;
      font-size: 13px;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    .input-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        3px 3px 8px rgba(0, 0, 0, 0.4),
        inset 1px 1px 1px rgba(255, 255, 255, 0.1);
    }

    .icon-btn:active { transform: scale(0.92); }

    .paste-btn { color: #00f2fe; }
    .paste-btn:hover {
      background: linear-gradient(135deg, #00f2fe, #0070f3);
      color: #000;
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.5);
      border-color: transparent;
    }

    .clear-btn { color: #ff0050; font-size: 14px; padding: 8px 11px; }
    .clear-btn:hover {
      background: linear-gradient(135deg, #ff0050, #ff007f);
      color: #fff;
      box-shadow: 0 0 12px rgba(255, 0, 80, 0.5);
      border-color: transparent;
    }

    /* Main Download Button */
    .main-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #ff0050, #00f2fe);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 0, 80, 0.3);
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .main-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(0, 242, 254, 0.4);
      filter: brightness(1.1);
    }

    .main-btn:active { 
      transform: scale(0.97);
      box-shadow: 0 5px 15px rgba(255, 0, 80, 0.4);
    }

    #result { margin-top: 25px; }

    /* Shimmer Skeleton Loader */
    .skeleton-card {
      background: rgba(11, 13, 20, 0.65);
      border-radius: 22px;
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    .skeleton-line {
      height: 14px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }

    .skeleton-line::after {
      content: "";
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, 
        transparent, 
        rgba(255, 255, 255, 0.15), 
        transparent
      );
      animation: shimmerWave 1.5s infinite;
    }

    @keyframes shimmerWave {
      100% { transform: translateX(100%); }
    }

    /* Result Card */
    .card-result {
      background: rgba(11, 13, 20, 0.65);
      border-radius: 22px;
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 
        inset 2px 2px 6px rgba(255, 255, 255, 0.03),
        0 12px 35px rgba(0, 0, 0, 0.6);
      animation: fadeIn 0.4s ease-in-out;
      text-align: left;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .author-card {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
      background: rgba(255, 255, 255, 0.03);
      padding: 10px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 2px solid #00f2fe;
      object-fit: cover;
    }

    .author-info h4 { color: #fff; font-size: 14px; font-weight: 600; }
    .author-info p { color: rgba(255, 255, 255, 0.5); font-size: 12px; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 15px;
      text-align: center;
    }

    .stat-badge {
      background: rgba(0, 0, 0, 0.4);
      padding: 8px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 11px;
      color: rgba(255, 255, 255, 0.8);
    }

    .stat-badge span {
      display: block;
      color: #00f2fe;
      font-weight: 600;
      font-size: 12px;
    }

    .cover-container { text-align: center; margin-bottom: 15px; }
    .cover-img {
      width: 130px;
      height: 170px;
      object-fit: cover;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .caption-box {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 15px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.85);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .caption-text {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }

    .copy-btn {
      background: rgba(0, 242, 254, 0.15);
      border: 1px solid rgba(0, 242, 254, 0.3);
      color: #00f2fe;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .copy-btn:hover { background: #00f2fe; color: #000; }
    .copy-btn:active { transform: scale(0.95); }

    .download-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      background: linear-gradient(135deg, #7928ca, #ff0080);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      box-shadow: 0 8px 20px rgba(255, 0, 128, 0.25);
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(255, 0, 128, 0.4);
    }

    .download-btn:active { transform: scale(0.97); }

    .download-btn-audio { background: linear-gradient(135deg, #f59e0b, #ef4444); box-shadow: 0 8px 20px rgba(245, 158, 11, 0.25); }
    .download-btn-cover { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25); }

    .slideshow-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 5px;
      margin-bottom: 15px;
    }

    .slide-item { position: relative; border-radius: 10px; overflow: hidden; }
    .slide-item img { width: 100%; height: 110px; object-fit: cover; display: block; }
    .slide-download-btn {
      position: absolute;
      bottom: 5px;
      right: 5px;
      background: rgba(0, 0, 0, 0.75);
      color: #00f2fe;
      border: none;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 10px;
      cursor: pointer;
    }
    .slide-download-btn:active { transform: scale(0.92); }

    /* Light Glass Mode Styles */
    body.light-mode { background-color: #eef2f7; }
    body.light-mode .toast {
      background: rgba(255, 255, 255, 0.95);
      color: #1e293b;
      border-color: rgba(0, 0, 0, 0.1);
      box-shadow: 0 5px 20px rgba(163, 177, 198, 0.4);
    }
    body.light-mode .toast.welcome { background: rgba(240, 244, 255, 0.95); color: #7928ca; }
    body.light-mode .container {
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 
        20px 20px 50px rgba(163, 177, 198, 0.5),
        -10px -10px 40px rgba(255, 255, 255, 0.8),
        inset 0 1px 1px rgba(255, 255, 255, 0.9);
    }
    body.light-mode .dev-badge,
    body.light-mode .theme-btn {
      background: rgba(255, 255, 255, 0.8);
      border-color: rgba(163, 177, 198, 0.4);
      color: #0070f3;
      box-shadow: 0 8px 20px rgba(163, 177, 198, 0.3);
    }
    body.light-mode .theme-btn { color: #333; }
    body.light-mode .input-wrapper {
      background: rgba(238, 242, 247, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 
        inset 4px 4px 10px rgba(163, 177, 198, 0.4),
        inset -3px -3px 8px rgba(255, 255, 255, 0.9);
    }
    body.light-mode input { color: #1e293b; }
    body.light-mode input::placeholder { color: rgba(0, 0, 0, 0.4); }
    body.light-mode .icon-btn {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(163, 177, 198, 0.3);
      box-shadow: 3px 3px 8px rgba(163, 177, 198, 0.3);
    }
    body.light-mode .card-result,
    body.light-mode .skeleton-card {
      background: rgba(240, 244, 248, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: inset 2px 2px 6px rgba(255, 255, 255, 0.8), 0 12px 35px rgba(163, 177, 198, 0.4);
    }
    body.light-mode .author-card {
      background: rgba(255, 255, 255, 0.5);
      border-color: rgba(163, 177, 198, 0.2);
    }
    body.light-mode .author-info h4 { color: #1e293b; }
    body.light-mode .author-info p { color: rgba(0, 0, 0, 0.5); }
    body.light-mode .stat-badge {
      background: rgba(255, 255, 255, 0.6);
      border-color: rgba(163, 177, 198, 0.2);
      color: #333;
    }
    body.light-mode .stat-badge span { color: #0070f3; }
    body.light-mode .caption-box { background: rgba(255, 255, 255, 0.5); color: #1e293b; }
    body.light-mode .skeleton-line { background: rgba(163, 177, 198, 0.3); }
    body.light-mode .skeleton-line::after {
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
    }
  </style>
</head>
<body>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Ambient Background Glowing Blobs -->
  <div class="background-blob-1"></div>
  <div class="background-blob-2"></div>

  <!-- Main Container -->
  <div class="container">
    
    <!-- Header with Dev Badge & Theme Toggle -->
    <div class="header-top">
      <div class="dev-badge">𝐃𝐞𝐯𝐞𝐥𝐨𝐩𝐞𝐫 𝐊𝐚𝐰𝐬𝐚𝐫</div>
      <button onclick="toggleTheme()" id="themeBtn" class="theme-btn">☀️ Light</button>
    </div>

    <h2>𝐓𝐢𝐤𝐓𝐨𝐤 𝐕𝐢𝐝𝐞𝐨 𝐃𝐨𝐰𝐧𝐥𝐨𝐚𝐝𝐞𝐫</h2>

    <div class="input-wrapper">
      <input type="text" id="videoUrl" placeholder="Insert TikTok link here...">
      <div class="input-actions">
        <button onclick="clearInput()" class="icon-btn clear-btn" title="Clear">✕</button>
        <button onclick="pasteClipboard()" class="icon-btn paste-btn" title="Paste">📋 𝐏𝐚𝐬𝐭𝐞</button>
      </div>
    </div>

    <button onclick="downloadVideo()" class="main-btn">𝐃𝐨𝐰𝐧𝐥𝐨𝐚𝐝</button>

    <div id="result"></div>
  </div>

  <script>
    // Custom Audio Greeting on First User Interaction
    let hasWelcomed = false;
    
    document.body.addEventListener("click", () => {
      if (!hasWelcomed) {
        playWelcomeVoice();
        showToast("Welcome by Developer Kawsar!", "welcome");
        hasWelcomed = true;
      }
    }, { once: true });

    function playWelcomeVoice() {
      let welcomeAudio = new Audio('welcome.mp3');
      welcomeAudio.volume = 1.0;
      welcomeAudio.play().catch(error => {
        console.log("Audio play error:", error);
      });
    }

    // Optimized Toast Notification System (Single Queue / Replacement & Shorter Duration)
    function showToast(message, type = 'success') {
      let container = document.getElementById("toast-container");
      
      // Remove previous toast instantly if exists (Queue/Replacement logic)
      container.innerHTML = "";

      let toast = document.createElement("div");
      toast.className = `toast ${type}`;
      let icon = type === 'success' ? '✅' : type === 'error' ? '❌' : '🤖';
      toast.innerHTML = `${icon} ${message}`;
      
      container.appendChild(toast);
      setTimeout(() => toast.classList.add("show"), 20);

      // Disappears quickly after 1.5 seconds (User sees it instantly and it goes away)
      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 250);
      }, 1500);
    }

    // Theme Switcher Logic
    function toggleTheme() {
      let body = document.body;
      let themeBtn = document.getElementById("themeBtn");
      body.classList.toggle("light-mode");
      
      if (body.classList.contains("light-mode")) {
        themeBtn.innerText = "🌙 Dark";
        showToast("Switched to Light Glass Mode");
      } else {
        themeBtn.innerText = "☀️ Light";
        showToast("Switched to Neon Dark Mode");
      }
    }

    // Smart Clipboard Paste
    async function pasteClipboard() {
      let input = document.getElementById("videoUrl");
      
      if (navigator.clipboard && window.isSecureContext) {
        try {
          const text = await navigator.clipboard.readText();
          if (text) {
            input.value = text;
            showToast("Link pasted successfully!");
            return;
          }
        } catch (err) {}
      }

      let pastedText = prompt("Ekhane link ta paste kor:");
      if (pastedText !== null && pastedText.trim() !== "") {
        input.value = pastedText.trim();
        showToast("Link pasted successfully!");
      }
    }

    function clearInput() {
      document.getElementById("videoUrl").value = "";
      showToast("Input cleared!", "error");
    }

    function copyCaption(encodedText) {
      let text = decodeURIComponent(encodedText);
      let success = false;

      let textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.top = "-9999px";
      textArea.style.left = "-9999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();

      try { success = document.execCommand('copy'); } catch (err) { success = false; }
      document.body.removeChild(textArea);

      if (!success && navigator.clipboard) {
        navigator.clipboard.writeText(text);
        success = true;
      }

      let btn = document.getElementById("copyBtn");
      if (btn) {
        btn.innerText = "✅ Copied!";
        showToast("Caption copied!");
        setTimeout(() => { btn.innerText = "📋 Copy"; }, 2000);
      }
    }

    function formatNum(num) {
      if (!num) return '0';
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num;
    }

    // Main Download Fetching Logic
    function downloadVideo() {
      let url = document.getElementById("videoUrl").value.trim();
      let resultDiv = document.getElementById("result");

      if (!url) {
        showToast("Please paste a link first!", "error");
        return;
      }

      // Shimmer Skeleton UI Animation
      resultDiv.innerHTML = `
        <div class="skeleton-card">
          <div class="skeleton-line" style="width: 50%; height: 18px;"></div>
          <div class="skeleton-line" style="width: 100%; height: 35px; border-radius: 10px;"></div>
          <div class="skeleton-line" style="width: 100%; height: 40px; border-radius: 12px;"></div>
          <div class="skeleton-line" style="width: 100%; height: 150px; border-radius: 14px;"></div>
          <div class="skeleton-line" style="width: 100%; height: 45px; border-radius: 14px;"></div>
        </div>
      `;

      fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`)
        .then(response => response.json())
        .then(data => {
          if (data.code === 0) {
            let res = data.data;
            
            let title = res.title || "TikTok Video";
            let cover = res.cover;
            let authorName = res.author?.nickname || "TikTok Creator";
            let authorId = res.author?.unique_id ? `@${res.author.unique_id}` : "@tiktok_user";
            let cleanAuthorTag = authorId.replace('@', '');
            let authorAvatar = res.author?.avatar || cover;

            let views = formatNum(res.play_count);
            let likes = formatNum(res.digg_count);
            let comments = formatNum(res.comment_count);

            let audioLink = res.music || res.music_info?.play;
            let hdVideoLink = res.hdplay ? res.hdplay : res.play;
            let encodedTitle = encodeURIComponent(title);

            let cardHtml = `
              <div class="card-result">
                <div class="author-card">
                  <img src="${authorAvatar}" class="avatar" alt="Avatar">
                  <div class="author-info">
                    <h4>${authorName}</h4>
                    <p>${authorId}</p>
                  </div>
                </div>

                <div class="stats-grid">
                  <div class="stat-badge">👁️ Views<span>${views}</span></div>
                  <div class="stat-badge">❤️ Likes<span>${likes}</span></div>
                  <div class="stat-badge">💬 Comments<span>${comments}</span></div>
                </div>

                <div class="caption-box">
                  <span class="caption-text">${title}</span>
                  <button id="copyBtn" onclick="copyCaption('${encodedTitle}')" class="copy-btn">📋 Copy</button>
                </div>
            `;

            if (res.images && res.images.length > 0) {
              cardHtml += `<div class="slideshow-grid">`;
              res.images.forEach((imgUrl, index) => {
                cardHtml += `
                  <div class="slide-item">
                    <img src="${imgUrl}" alt="Slide ${index+1}">
                    <button onclick="saveFile('${imgUrl}', '${cleanAuthorTag}_slide_${index+1}.jpg', this)" class="slide-download-btn">⬇️ Save</button>
                  </div>
                `;
              });
              cardHtml += `</div>`;
            } else {
              cardHtml += `
                <div class="cover-container">
                  <img src="${cover}" class="cover-img" alt="Thumbnail">
                </div>
                <button onclick="saveFile('${hdVideoLink}', '${cleanAuthorTag}_video_hd.mp4', this)" class="download-btn">🔥 𝐅𝐮𝐥𝐥 𝐇𝐃 𝐕𝐢𝐝𝐞𝐨</button>
              `;
            }

            if (audioLink) {
              cardHtml += `<button onclick="saveFile('${audioLink}', '${cleanAuthorTag}_audio.mp3', this)" class="download-btn download-btn-audio">🎵 𝐃𝐨𝐰𝐧𝐥𝐨𝐚𝐝 𝐌𝐏𝟑 𝐀𝐮𝐝𝐢𝐨</button>`;
            }

            if (cover) {
              cardHtml += `<button onclick="saveFile('${cover}', '${cleanAuthorTag}_cover.jpg', this)" class="download-btn download-btn-cover">🖼️ 𝐃𝐨𝐰𝐧𝐥𝐨𝐚𝐝 𝐂𝐨𝐯𝐞𝐫 𝐈𝐦𝐚𝐠𝐞</button>`;
            }

            cardHtml += `</div>`;
            resultDiv.innerHTML = cardHtml;
            showToast("Fetched successfully!");

          } else {
            showToast("Invalid link or not found!", "error");
            resultDiv.innerHTML = "<p style='color:#ff4757; font-size:14px; text-align:center;'>❌ Video খুঁজে পাওয়া যায়নি বা লিংক ভুল!</p>";
          }
        })
        .catch(error => {
          showToast("Network error!", "error");
          resultDiv.innerHTML = "<p style='color:#ff4757; font-size:14px; text-align:center;'>❌ কোনো সমস্যা হয়েছে, নেট চেক করে আবার চেষ্টা কর!</p>";
        });
    }

    // Dynamic File Save Engine
    async function saveFile(fileUrl, fileName, btnElement) {
      let originalText = btnElement.innerText;
      btnElement.innerText = "⏳ 𝐃𝐨𝐰𝐧𝐥𝐨𝐚𝐝𝐢𝐧𝐠...";
      btnElement.disabled = true;
      showToast(`Starting download...`);

      try {
        let response = await fetch(fileUrl);
        let blob = await response.blob();
        let blobUrl = URL.createObjectURL(blob);

        let a = document.createElement("a");
        a.href = blobUrl;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);

        btnElement.innerText = "✅ 𝐂𝐨𝐦𝐩𝐥𝐞𝐭𝐞!";
        showToast("Download completed!");
        setTimeout(() => {
          btnElement.innerText = originalText;
          btnElement.disabled = false;
        }, 3000);
      } catch (err) {
        window.open(fileUrl, "_blank");
        btnElement.innerText = originalText;
        btnElement.disabled = false;
        showToast("Opening in new tab...", "success");
      }
    }
  </script>

</body>
</html>
